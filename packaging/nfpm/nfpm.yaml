name: mechanix-flutter-engine
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: libs
priority: optional
maintainer: "Dhruvesh B <dhruveshb@mechasystems.com>"
description: Shared flutter-elinux engine and Wayland embedder libraries for Mechanix apps
homepage: https://github.com/mecha-org/mechanix-flutter-engine.git
license: BSD

overrides:
  rpm:
    contents:
      - src: ./artifacts/libflutter_engine.so
        dst: /usr/lib64/libflutter_engine.so
        file_info:
          mode: 0644
      - src: ./artifacts/libflutter_elinux_wayland.so
        dst: /usr/lib64/libflutter_elinux_wayland.so
        file_info:
          mode: 0644
  deb:
    contents:
      - src: ./artifacts/libflutter_engine.so
        dst: /usr/lib/__DEB_TRIPLET__/libflutter_engine.so
        file_info:
          mode: 0644
      - src: ./artifacts/libflutter_elinux_wayland.so
        dst: /usr/lib/__DEB_TRIPLET__/libflutter_elinux_wayland.so
        file_info:
          mode: 0644

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
